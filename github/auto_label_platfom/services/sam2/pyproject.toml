[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alp-sam2"
version = "0.1.0"
description = "SAM2 model service (MVP stub)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "pydantic>=2.7.0", "numpy>=1.26.0"]

[tool.setuptools.packages.find]
where = ["src"]
