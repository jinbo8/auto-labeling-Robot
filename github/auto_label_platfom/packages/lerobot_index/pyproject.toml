[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-index"
version = "0.1.0"
description = "LeRobot v3 indexing and annotation export helpers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
